<style>
:root { --orange: #FF5B00; --white: #FFFFFF; --ink: #222222; --head: 'Playfair Display', Georgia, serif; --body: 'Inter', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--orange); color: var(--white); font-family: var(--body); display: flex; align-items: center; padding: 0 max(24px, 8vw); }
.gate { width: 100%; max-width: 520px; }
.gate img { width: 170px; display: block; }
h1 { font-family: var(--head); font-weight: 900; font-size: clamp(40px, 6vw, 64px); line-height: 1.05; margin: 36px 0 18px; }
p { font-size: 18px; margin: 0 0 32px; opacity: .9; }
form { display: flex; gap: 12px; flex-wrap: wrap; }
input { flex: 1 1 240px; min-width: 0; font: 18px var(--body); padding: 16px 20px; border: 0; border-radius: 14px; color: var(--ink); background: var(--white); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button { font: 700 18px var(--body); padding: 16px 28px; border: 2px solid var(--white); border-radius: 14px; background: transparent; color: var(--white); cursor: pointer; }
button:hover { background: var(--white); color: var(--orange); }
.err { min-height: 26px; margin-top: 14px; font-weight: 700; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(out);
}
function show(page) { document.open(); document.write(page); document.close(); }
// remember the password for this tab only, so a refresh mid-call does not ask again
try { const saved = sessionStorage.getItem('ah-pw'); if (saved) unlock(saved).then(show).catch(() => sessionStorage.removeItem('ah-pw')); } catch (e) {}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  err.textContent = 'Opening...';
  try {
    const page = await unlock(pw);
    try { sessionStorage.setItem('ah-pw', pw); } catch (e) {}
    show(page);
  } catch (x) { err.textContent = 'That password did not work. Try again.'; }
});
